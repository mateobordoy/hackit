[project]
name = "hackit2"
version = "2.0.0"
description = "Hack It's autonomous buyer agent for the Tacto Negotiation Arena"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["arena-kit[anthropic,sim,mcp]"]

[project.scripts]
hackit2 = "hackit2.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
arena-kit = { git = "https://github.com/tacto-playground/negotiation-arena-kit", subdirectory = "starter-kit", rev = "75eecd19bf42c4f4b5a93f01139fa2a757ec5c07" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hackit2"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
