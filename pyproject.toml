[project]
name = "hollerau-buyer"
version = "0.1.0"
description = "Belief-based buyer agent for the Tacto Negotiation Arena: it models each supplier and plans every move"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "arena-kit[sim] @ git+https://github.com/tacto-playground/negotiation-arena-kit@a3e4086401fb926cb3077e1c10f90de1eb58c1bc#subdirectory=starter-kit",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
buyer = "buyer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["buyer"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: real-clock tests (about a minute)"]
