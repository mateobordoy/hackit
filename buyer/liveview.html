function priceSeries(s){

 if(q0!==null)theirs.push({x:0,y:q0});
 for(const n of s.notes){
  if(n.what==='send'){round++;if(num(n.price)!==null)ours.push({x:round,y:Number(n.price)});}
  if(n.what==='reply'&&num(n.theirs)!==null)theirs.push({x:Math.max(1,round),y:Number(n.theirs)});
  const b=obj(n.belief);
  if(q0!==null&&['floor_p10','floor_p50','floor_p90'].every(k=>num(b[k])!==null)){
   bands.set(Math.max(1,round),{x:Math.max(1,round),lo:Number(b.floor_p10)*q0,y:Number(b.floor_p50)*q0,hi:Number(b.floor_p90)*q0});

 for(let i=0;i<5;i++){
  const v=ymin+(ymax-ymin)*i/4,py=y(v);svg+=`<line x1="${L}" y1="${py}" x2="${W-R}" y2="${py}" stroke="#354157"/><text x="${L-8}" y="${py+4}" text-anchor="end">€${esc(fmt(v,Math.abs(high)<100?2:0))}</text>`;

  if(floor.length===1){const p=floor[0];svg+=`<line x1="${x(p.x)}" x2="${x(p.x)}" y1="${y(p.lo)}" y2="${y(p.hi)}" stroke="#3ddc97" stroke-width="9" opacity=".3"/>`;}

 }

}

 let svg='<svg class="system-map" viewBox="0 0 1270 610" role="group" aria-label="Buyer module map"><rect class="buyer-boundary" x="250" y="20" width="1010" height="580" rx="18"/><text class="group-title" x="275" y="47">HOLLERAU BUYER</text>';
 for(const [a,b] of EDGES){
  const A=NODES[a],B=NODES[b],key=edgeKey(a,b),observed=rows.filter(t=>edgeKey(t.from,t.to)===key),active=live&&observed.some(t=>num(t.at)!==null&&lastAt-Number(t.at)<2);
  const dx=B.x-A.x,dy=B.y-A.y,vertical=Math.abs(dy)>Math.abs(dx),ax=A.x+(vertical?0:Math.sign(dx)*112),ay=A.y+(vertical?Math.sign(dy)*33:0),bx=B.x-(vertical?0:Math.sign(dx)*112),by=B.y-(vertical?Math.sign(dy)*33:0);
  let path=`M${ax},${ay} L${bx},${by}`;
  if(a==='writer'&&b==='runner')path='M1140,338 V410 H375 V338';
  const label=`${A.label} ↔ ${B.label}`;
  svg+=`<g class="connection ${observed.length?'observed':''} ${FLOW===key?'selected':''}" role="button" tabindex="0" data-action="flow" data-value="${key}" aria-label="${esc(label)}"><title>${esc(label)} · ${observed.length} transfers</title><path class="edge-hit" d="${path}"/><path class="edge ${active?'flow':''}" d="${path}"/></g>`;
 }
 for(const [id,n] of Object.entries(NODES)){
  const active=live&&rows.some(t=>(t.from===id||t.to===id)&&lastAt-(num(t.at)??0)<2);
  svg+=`<g class="node ${n.cls||''} ${active?'active':''} ${MAP_NODE===id?'focused':''}" transform="translate(${n.x-112},${n.y-33})" role="button" tabindex="0" data-action="node" data-value="${id}" aria-label="${esc(n.label)}"><rect width="224" height="66" rx="10"/><text class="node-title" x="12" y="27">${esc(n.label)}</text><text class="sub" x="12" y="46">${esc(n.sub)}</text></g>`;
 }
 return svg+'</svg>';
}
function inspector(m){
 const all=transfers(m),rows=FLOW?all.filter(t=>edgeKey(t.from,t.to)===FLOW):MAP_NODE?all.filter(t=>t.from===MAP_NODE||t.to===MAP_NODE):[];
 const selected=rows.find(t=>t.key===FLOW_ITEM)||rows.at(-1),node=NODES[MAP_NODE];
 if(!FLOW&&!node)return '<div class="flow-empty"><span class="inspect-icon">↔</span><div><b>Follow a decision through the system</b><p>Click any connection for request and response JSON, or a module for its recorded transfers.</p></div></div>';
 const heading=node?node.label:FLOW.split('|').map(id=>NODES[id]?.label||id).join(' ↔ ');
 const connections=node?EDGES.filter(([a,b])=>a===MAP_NODE||b===MAP_NODE).map(([a,b])=>button('flow',`${NODES[a].label} ↔ ${NODES[b].label}`,edgeKey(a,b))).join(''):'';
 return `<div class="inspector-head"><h3>${esc(heading)}</h3>${button('clear-flow','Clear')}</div>${node?`<p class="muted">${esc(node.desc||node.sub)}</p><div class="connection-list">${connections}</div>`:''}
  <div class="recent-transfers">${rows.map(t=>button('transfer',`${tm(t.at)} · ${t.label||'Transfer'}${t.supplier?' · '+t.supplier:''}`,t.key,t.key===selected?.key)).join('')}</div>
  ${selected?`<div class="flow-meta"><b>${esc(selected.label)}</b><span>${esc(selected.from)} → ${esc(selected.to)}</span><span>${esc(selected.supplier)}</span><span>${esc(tm(selected.at))}</span><span>ID ${esc(selected.id)}</span></div><div class="payload-grid"><div class="payload"><h4>Request</h4>${pre(selected.request)}</div><div class="payload"><h4>Response</h4>${pre(selected.response)}</div></div>`:empty('No transfers captured for this connection in the visible events.')}`;
}
function sparkline(runs){
 const values=arr(runs).map(num),valid=values.filter(v=>v!==null);if(!valid.length)return '–';
 const min=Math.min(...valid),max=Math.max(...valid),den=Math.max(max-min,.001),x=i=>3+i/Math.max(1,values.length-1)*94,y=v=>24-(v-min)/den*20;
 let path='',pen=false;values.forEach((v,i)=>{if(v===null){pen=false;return;}path+=`${pen?'L':'M'}${x(i)},${y(v)} `;pen=true;});
 return `<svg class="spark" viewBox="0 0 100 28" role="img" aria-label="Scores oldest to newest: ${esc(values.map(v=>fmt(v,3)).join(', '))}"><path d="${path}" stroke="#5b8cff" stroke-width="2" fill="none"/>${valid.length===1?`<circle cx="${x(values.findIndex(v=>v!==null))}" cy="${y(valid[0])}" r="2.5" fill="#5b8cff"/>`:''}</svg>`;
}
function scoresView(){
 const rows=arr(SCORES.rows),tot=obj(SCORES.totals),team=obj(SCORES.team);
 return `<div class="section-heading"><div><div class="eyebrow">PERFORMANCE</div><h2>Scores</h2><p class="muted">Scores as reported · runs oldest to newest</p></div>${button('scores','Refresh')}</div>
  <div class="tiles">${[['Mean',tot.mean],['Our best',tot.best],['Reference batch',tot.reference_batch],['Reference best',tot.reference_best]].map(([label,v])=>`<div class="tile"><div class="l">${label}</div><div class="n">${fmt(v,3)}</div></div>`).join('')}</div>
  ${team.error?`<p class="notice">${esc(team.error)}</p>`:''}<p class="muted">${team.offline?'Team scores offline':team.at?'Team scores updated '+esc(date(team.at)):'Team score update time unavailable'}</p>
  <section class="card tablewrap"><table><thead><tr>${['Case','Latest','Previous','Change','Our best','Mean','n','Team best','Reference batch','Reference best','Runs'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>
  ${rows.map(r=>`<tr><th>${esc(r.case)}</th><td>${fmt(r.latest,3)}</td><td>${fmt(r.previous,3)}</td><td class="${num(r.change)>0?'positive':num(r.change)<0?'negative':''}">${num(r.change)>0?'+':''}${fmt(r.change,3)}</td><td>${fmt(r.best,3)}</td><td>${fmt(r.mean,3)}</td><td>${fmt(r.n,0)}</td><td>${fmt(r.team_best,3)}</td><td>${fmt(r.reference_batch,3)}</td><td>${fmt(r.reference_best,3)}</td><td>${sparkline(r.runs)}</td></tr>`).join('')}
  <tr><th>Totals</th><td colspan="3">–</td><td>${fmt(tot.best,3)}</td><td>${fmt(tot.mean,3)}</td><td colspan="2">–</td><td>${fmt(tot.reference_batch,3)}</td><td>${fmt(tot.reference_best,3)}</td><td>–</td></tr></tbody></table>${!rows.length?empty('No scored runs yet.'):''}</section>`;
}
function historyView(){
 const runs=arr(HISTORY.runs);
 return `<div class="section-heading"><div><div class="eyebrow">RECORDED SESSIONS</div><h2>Run history</h2><p class="muted">Select a run to inspect it. Recorded runs stay pinned.</p></div>${button('history','Refresh')}</div>
  <section class="card tablewrap"><table><thead><tr>${['Case / title','Session','Set','Type','Started','Score','Deal','Source','Events'].map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>
  ${runs.map((r,i)=>`<tr class="click" tabindex="0" role="button" data-action="run" data-value="${i}" aria-label="Open run ${esc(r.session)}"><td><b>${esc(r.case_id)}</b><div class="sub">${esc(r.title)}</div></td><td>${esc(r.session)}</td><td>${esc(r.set)}</td><td>${esc(r.type)}</td><td>${esc(date(r.started))}</td><td>${fmt(r.score,3)}</td><td>${r.deal===true?'Yes':r.deal===false?'No':'–'}</td><td>${esc(r.source)}</td><td>${r.has_live?'Live log':'Notes only'}</td></tr>`).join('')}
  </tbody></table>${!runs.length?empty('No recorded runs yet.'):''}</section>`;
}
function startReplay(speed){
 const events=ordered(S.events);if(!events.length)return;
 const first=num(events[0].at),version=VERSION;
 REPLAY={events,count:0,speed,version,started:performance.now(),first};FLOW_ITEM=null;openDetails.clear();render();
}
function tickReplay(){
 const r=REPLAY;if(!r||r.count>=r.events.length)return;
 const previous=r.count;
 const elapsed=(performance.now()-r.started)/1000*r.speed;
 while(r.count<r.events.length){
  const e=r.events[r.count],at=num(e.at),delay=r.first!==null&&at!==null?Math.max(0,at-r.first):r.count*.5;
  if(delay>elapsed)break;r.count++;
 }
 if(r.count!==previous)render();
}
async function action(el){
 const a=el.dataset.action,v=el.dataset.value;
 if(a==='case'){const c=CASES[Number(v)];if(c?.case)selectCase(c.case);}
 else if(a==='scores')await showScores();
 else if(a==='history')await showHistory();
 else if(a==='run')await loadRun(Number(v));
 else if(a==='tab'){TAB=v;render();}
 else if(a==='filter'){FILTER=v;render();}
 else if(a==='flow'){FLOW=v;MAP_NODE=null;FLOW_ITEM=null;render();}
 else if(a==='node'){MAP_NODE=v;FLOW=null;FLOW_ITEM=null;render();}
 else if(a==='transfer'){FLOW_ITEM=v;render();}
 else if(a==='clear-flow'){FLOW=null;MAP_NODE=null;FLOW_ITEM=null;render();}
 else if(a==='replay')startReplay(Number(v));
 else if(a==='live'){REPLAY=null;render();if(!PINNED)poll();}
}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)action(el);});
document.addEventListener('keydown',e=>{
 const el=e.target.closest('[data-action]');
 if(el&&el.tagName!=='BUTTON'&&['Enter',' '].includes(e.key)){e.preventDefault();action(el);}
});
setInterval(()=>{$('#clock').textContent=new Date().toLocaleTimeString([],{hour12:false});},1000);
setInterval(tickReplay,200);setInterval(poll,2000);poll();
</script></body></html>
