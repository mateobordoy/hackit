function priceSeries(s){

 for(const n of s.notes){
  if(n.what==='send'){round++;if(num(n.price)!==null)ours.push({x:round,y:Number(n.price)});}
  if(n.what==='reply'&&num(n.theirs)!==null)theirs.push({x:Math.max(1,round),y:Number(n.theirs)});
  const b=obj(n.belief);
  if(q0!==null&&['floor_p10','floor_p50','floor_p90'].every(k=>num(b[k])!==null)){
   bands.set(Math.max(1,round),{x:Math.max(1,round),lo:Number(b.floor_p10)*q0,y:Number(b.floor_p50)*q0,hi:Number(b.floor_p90)*q0});

  const e=r.events[r.count],at=num(e.at),delay=r.first!==null&&at!==null?Math.max(0,at-r.first):r.count*.5;

 const principles=[['01','Code owns every number','The model writes prose. Offers and costs come from code.'],['02','Belief + planner, not a recipe','Learn from every reply. Simulate the next decision in EUR.'],['03','Guards that never bend','Protect must-haves, the alternative and acceptable standing offers.']];
 return `<div class="sc-principles">${principles.map(([i,title,caption],j)=>`<div class="sc-panel sc-principle" style="--delay:${j*.4}s"><span>${i}</span><div><h3>${title}</h3><p>${caption}</p></div></div>`).join('')}</div><div class="sc-wordmark">Hack <span>IT</span></div>`;
}
function showcaseVisual(step={},story={}){
 step=obj(step);story=obj(story);
 const renderers={intro:showcaseIntro,prep:showcasePrep,send:showcaseEmail,reply:(s,b)=>showcaseEmail(s,b,true)+showcaseBelief(s,b),plan:showcasePlan,guard:showcaseGuard,close:showcaseClose,result:showcaseResult,outro:showcaseOutro};
 return Object.hasOwn(renderers,step.kind)?renderers[step.kind](step,story):'<div class="sc-panel sc-muted">Follow the next decision through the buyer system.</div>';
}
/* A compact map keeps module names readable on a 1280×720 projector. */
function showcaseMap(step={}){
 const positions={arena:[100,60],runner:[300,60],writer:[500,60],reader:[100,180],policy:[300,180],supplier:[500,180],evidence:[100,300],planner:[300,300],economics:[500,300],records:[100,420],belief:[300,420],memory:[500,420]};
 const labels={reader:'Reader · LLM',writer:'Writer · LLM',policy:'Negotiator / guards',supplier:'Supplier profile',belief:'Belief · 400'};
 const subs={arena:'Supplier e-mail API',runner:'Messages + clock',writer:'Code owns numbers',reader:'Labels + quotes',policy:'Decisions + boundaries',supplier:'Owner + signals',evidence:'Ranked data claims',planner:'Expected total C',economics:'Terms + total cost',records:'Run log + report',belief:'Floor, step, patience',memory:'Earlier floor priors'};
 const flow=arr(obj(step).flow).map(arr).filter(([a,b])=>Object.hasOwn(positions,a)&&Object.hasOwn(positions,b)&&a!==b),n=Math.max(1,flow.length),cycle=n*1.1;
 const path=(a,b)=>{const [ax,ay]=positions[a],[bx,by]=positions[b],dx=bx-ax,dy=by-ay,horizontal=Math.abs(dx)>Math.abs(dy),sx=ax+(horizontal?Math.sign(dx)*85:0),sy=ay+(horizontal?0:Math.sign(dy)*31),ex=bx-(horizontal?Math.sign(dx)*85:0),ey=by-(horizontal?0:Math.sign(dy)*31);return `M${sx},${sy} L${ex},${ey}`;};
 const end=Number((90/n).toFixed(3)),fade=Number((98/n).toFixed(3));
 let svg=`<svg class="sc-map" viewBox="0 0 600 480" role="img" aria-label="System map: ${esc(flow.map(([a,b])=>a+' to '+b).join(', ')||'buyer modules')}"><style>@keyframes sc-flow-packet{0%{offset-distance:0%;opacity:0}1%{offset-distance:0%;opacity:1}${end}%{offset-distance:100%;opacity:1}${fade}%,100%{offset-distance:100%;opacity:0}}@keyframes sc-flow-edge{0%{opacity:.15}1%,${end}%{opacity:1}${fade}%,100%{opacity:.15}}@keyframes sc-flow-node{0%,100%{stroke-width:1.4;filter:none}1%,${end}%{stroke:#4dd2ff;stroke-width:2.4;filter:drop-shadow(0 0 7px #4dd2ff88)}${fade}%{stroke-width:1.4;filter:none}}</style>`;
 const edges=[...EDGES];for(const [a,b] of flow)if(!edges.some(([x,y])=>edgeKey(x,y)===edgeKey(a,b)))edges.push([a,b]);
 for(const [a,b] of edges)svg+=`<path class="sc-map-edge" d="${path(a,b)}"/>`;
 flow.forEach(([a,b],i)=>{const p=path(a,b),style=`--flowdur:calc(${cycle}s * var(--tempo));--lag:calc(${i*1.1}s * var(--tempo))`;svg+=`<path class="sc-map-active" style="${style};animation-name:sc-flow-edge" d="${p}"/><circle class="sc-packet" r="4" style="${style};animation-name:sc-flow-packet;offset-path:path('${p}')"/>`;});
 for(const [id,[x,y]] of Object.entries(positions)){
  const node=NODES[id],index=flow.findIndex(([a,b])=>a===id||b===id),active=index>=0;
  svg+=`<g class="sc-node ${node.cls||''} ${active?'sc-active':''}" transform="translate(${x-85},${y-31})" style="--flowdur:calc(${cycle}s * var(--tempo));--lag:calc(${Math.max(0,index)*1.1}s * var(--tempo))"><rect width="170" height="62" rx="11" style="animation-name:${active?'sc-flow-node':'none'}"/><text x="85" y="26" text-anchor="middle">${esc(labels[id]??node.label)}</text><text class="sc-node-sub" x="85" y="44" text-anchor="middle">${esc(subs[id])}</text></g>`;
 }
 return svg+'</svg>';
}
function showcaseDuration(step){
 step=obj(step);const base={intro:6200,prep:7400,send:6000,reply:7200,plan:6800,guard:5000,close:5000,result:7200,outro:7800};
 return Math.min(9000,Math.max(5000,(base[step.kind]??6000)+Math.max(0,String(step.caption??'').length-130)*9));
}
const SHOW={open:false,story:{},steps:[],index:0,elapsed:0,playing:true,speed:1,last:0,raf:0,version:0,controller:null,focus:null,overflow:'',requestSession:''};
function showcaseControls(){
 const count=SHOW.steps.length,ready=count>0;
 $('#scCounter').textContent=`Step ${ready?SHOW.index+1:'–'} / ${count||'–'}`;
 $('#scPlay').textContent=SHOW.playing?'Ⅱ Pause':'▶ Play';$('#scPlay').setAttribute('aria-label',SHOW.playing?'Pause showcase (Space)':'Play showcase (Space)');
 $('#showcase').classList.toggle('paused',!SHOW.playing);$('#showcase').style.setProperty('--tempo',String(1/SHOW.speed));
 $('#scPrev').disabled=!ready||SHOW.index===0;$('#scNext').disabled=!ready||SHOW.index===count-1;$('#scPlay').disabled=!ready;$('#scRestart').disabled=!ready;
 $('#scTicks').innerHTML=SHOW.steps.map((step,i)=>`<button class="sc-tick ${i<SHOW.index?'past':i===SHOW.index?'current':''}" data-sc-step="${i}" title="${esc((i+1)+'. '+(step.title??step.kind??'Step'))}" aria-label="${esc('Step '+(i+1)+': '+(step.title??step.kind??'Step'))}" ${i===SHOW.index?'aria-current="step"':''}><i></i></button>`).join('');
}
function showcaseStep(index){
 if(!SHOW.steps.length)return;
 SHOW.index=Math.max(0,Math.min(SHOW.steps.length-1,index));SHOW.elapsed=0;SHOW.last=performance.now();
 const s=SHOW.steps[SHOW.index],flow=arr(s.flow).map(arr).filter(([a,b])=>Object.hasOwn(NODES,a)&&Object.hasOwn(NODES,b));
 $('#scBody').innerHTML=`<div class="sc-map-pane"><div class="sc-map-heading"><span class="sc-kicker">Inside the buyer</span><span class="sc-live-label">${esc(s.kind??'decision')} ${s.round!=null?'· round '+esc(s.round):''}</span></div><div class="sc-map-slot">${showcaseMap(s)}</div><div class="sc-route"><b>Data in motion</b><br><span id="scRouteText">${flow.length?esc(NODES[flow[0][0]].label)+' → '+esc(NODES[flow[0][1]].label):'A buyer that explains every decision.'}</span></div><div class="sc-map-legend"><span><i></i>Code + decisions</span><span><i style="background:var(--llm)"></i>Language models</span><span><i style="background:var(--them)"></i>Arena</span></div></div><div class="sc-stage"><article class="sc-step"><div class="sc-kicker">${esc(s.kind??'Decision')}${s.supplier?' / '+esc(s.supplier):''}</div><h2 id="scStepTitle">${esc(s.title??scLabel(s.kind))}</h2><p class="sc-caption" aria-label="${esc(s.caption??'')}"><span class="sc-caption-ghost" aria-hidden="true">${esc(s.caption??'')}</span><span class="sc-caption-live" id="scCaption" aria-hidden="true"></span></p><div class="sc-visual">${showcaseVisual(s,SHOW.story)}</div></article></div>`;
 showcaseControls();showcaseFrameContent();
}
function showcaseFrameContent(){
 const step=SHOW.steps[SHOW.index];if(!step)return;
 const caption=String(step.caption??''),typed=SHOW.playing?Math.min(caption.length,Math.floor(SHOW.elapsed/Math.min(18,2600/Math.max(1,caption.length)))):caption.length;
 const live=$('#scCaption');if(live){live.textContent=caption.slice(0,typed);live.parentElement.classList.toggle('complete',typed===caption.length);}
 const flow=arr(step.flow).map(arr).filter(([a,b])=>Object.hasOwn(NODES,a)&&Object.hasOwn(NODES,b)),route=$('#scRouteText');
 if(route&&flow.length){const [a,b]=flow[Math.floor(SHOW.elapsed/1100)%flow.length];route.textContent=NODES[a].label+' → '+NODES[b].label;}
 const ratio=SHOW.playing?Math.min(1,SHOW.elapsed/1100):1,ease=1-Math.pow(1-ratio,3);
 document.querySelectorAll('#scBody [data-sc-count]').forEach(el=>{const value=Number(el.dataset.scCount)*ease,digits=Number(el.dataset.scDigits)||0,kind=el.dataset.scFormat;el.textContent=kind==='eur'?'€'+fmt(value,digits):kind==='pct'?fmt(value*100,digits)+'%':fmt(value,digits);});
 const tick=$('#scTicks .current i');if(tick)tick.style.width=Math.min(100,SHOW.elapsed/showcaseDuration(step)*100)+'%';
}
function showcaseTick(now){
 if(!SHOW.open)return;
 const delta=Math.max(0,Math.min(100,now-SHOW.last));SHOW.last=now;
 if(SHOW.playing&&SHOW.steps.length){
  SHOW.elapsed+=delta*SHOW.speed;showcaseFrameContent();
  if(SHOW.elapsed>=showcaseDuration(SHOW.steps[SHOW.index])){
   if(SHOW.index<SHOW.steps.length-1)showcaseStep(SHOW.index+1);else{SHOW.playing=false;showcaseControls();showcaseFrameContent();}
  }
 }
 SHOW.raf=requestAnimationFrame(showcaseTick);
}
async function showcaseLoad(session=''){
 const version=++SHOW.version;SHOW.requestSession=String(session??'');SHOW.controller?.abort();const controller=new AbortController();SHOW.controller=controller;
 SHOW.steps=[];SHOW.playing=true;showcaseControls();$('#showcase').setAttribute('aria-busy','true');$('#scRun').disabled=true;$('#scCaseTitle').textContent='Loading recorded negotiation…';$('#scOutcome').textContent='SHOWCASE';$('#scOutcome').classList.add('neutral');
 $('#scBody').innerHTML='<div class="sc-loading"><div class="sc-kicker">HackIt Buyer</div><h2>Preparing the showcase…</h2><p>Loading a recorded negotiation from this server.</p></div>';
 const timeout=setTimeout(()=>controller.abort(),12000);
 try{
  const response=await fetch('/api/showcase'+(session?'?session='+encodeURIComponent(session):''),{cache:'no-store',signal:controller.signal});
  if(!response.ok)throw new Error('The showcase could not be loaded.');
  const story=obj(await response.json());if(version!==SHOW.version||!SHOW.open)return;
  SHOW.story=story;SHOW.steps=arr(story.steps).filter(s=>s&&typeof s==='object'&&!Array.isArray(s)).map(obj);
  const choices=arr(story.choices).map(obj).filter(c=>c.session!=null),current=String(story.session??session??'');
  if(!choices.some(c=>String(c.session)===current)&&current)choices.unshift({session:current,title:story.title,case_id:story.case_id});
  $('#scRun').innerHTML=choices.map(c=>`<option value="${esc(c.session)}" ${String(c.session)===current?'selected':''}>${esc([c.case_id,c.title??c.session,c.deal===true?'deal':c.deal===false?'walk away':null].filter(Boolean).join(' · '))}</option>`).join('')||'<option>No other runs</option>';
  $('#scRun').disabled=choices.length<2;$('#scCaseTitle').textContent=String(story.title??'Recorded negotiation');const result=obj(story.result);
  $('#scOutcome').textContent=result.deal===true?'DEAL'+(num(result.score)!==null?' · '+fmt(result.score,3):''):result.deal===false?'WALK AWAY':'RECORDED RUN';$('#scOutcome').classList.toggle('neutral',result.deal!==true);
  if(!SHOW.steps.length){SHOW.playing=false;$('#scBody').innerHTML='<div class="sc-loading"><h2>No showcase steps yet</h2><p>Save a recorded run to build a walkthrough, then try again.</p><button class="btn" data-sc-retry>↻ Try again</button></div>';showcaseControls();return;}
  showcaseStep(0);
 }catch(error){
  if(version!==SHOW.version||!SHOW.open)return;
  SHOW.playing=false;$('#scCaseTitle').textContent='Showcase unavailable';$('#scBody').innerHTML='<div class="sc-loading"><div class="sc-kicker">The projector can wait a moment</div><h2>We couldn’t load this showcase.</h2><p>The local server may be starting, or no recorded run is available yet. Try again when a run is ready.</p><button class="btn" data-sc-retry>↻ Try again</button></div>';$('#scRun').disabled=$('#scRun').options.length<2;showcaseControls();
 }finally{clearTimeout(timeout);if(version===SHOW.version)$('#showcase').removeAttribute('aria-busy');}
}
function openShowcase(){
 if(SHOW.open)return;SHOW.open=true;SHOW.focus=document.activeElement;SHOW.overflow=document.body.style.overflow;document.body.style.overflow='hidden';
 document.querySelector('body > header').inert=true;$('.layout').inert=true;$('#showcase').hidden=false;$('#scClose').focus();SHOW.last=performance.now();SHOW.raf=requestAnimationFrame(showcaseTick);showcaseLoad();
}
function closeShowcase(){
 if(!SHOW.open)return;SHOW.open=false;SHOW.version++;SHOW.controller?.abort();cancelAnimationFrame(SHOW.raf);$('#showcase').hidden=true;document.body.style.overflow=SHOW.overflow;document.querySelector('body > header').inert=false;$('.layout').inert=false;SHOW.focus?.focus();
}
function showcaseToggle(){
 if(!SHOW.steps.length)return;
 if(!SHOW.playing&&SHOW.index===SHOW.steps.length-1&&SHOW.elapsed>=showcaseDuration(SHOW.steps[SHOW.index]))showcaseStep(0);
 SHOW.playing=!SHOW.playing;SHOW.last=performance.now();showcaseControls();showcaseFrameContent();
}
$('#showcaseBtn').addEventListener('click',openShowcase);$('#scClose').addEventListener('click',closeShowcase);
$('#scPlay').addEventListener('click',showcaseToggle);$('#scPrev').addEventListener('click',()=>showcaseStep(SHOW.index-1));$('#scNext').addEventListener('click',()=>showcaseStep(SHOW.index+1));
$('#scRestart').addEventListener('click',()=>{SHOW.playing=true;showcaseStep(0);});
$('#scSpeed').addEventListener('change',e=>{SHOW.speed=[.5,1,2].includes(Number(e.target.value))?Number(e.target.value):1;SHOW.last=performance.now();showcaseControls();showcaseFrameContent();});
$('#scRun').addEventListener('change',e=>showcaseLoad(e.target.value));
$('#showcase').addEventListener('click',e=>{const tick=e.target.closest('[data-sc-step]');if(tick)showcaseStep(Number(tick.dataset.scStep));if(e.target.closest('[data-sc-retry]'))showcaseLoad(SHOW.requestSession);});
document.addEventListener('keydown',e=>{
 if(!SHOW.open)return;
 if(e.key==='Escape'){e.preventDefault();closeShowcase();return;}
 if(e.key==='Tab'){
  const focusable=[...$('#showcase').querySelectorAll('button:not(:disabled),select:not(:disabled),summary')].filter(el=>el.getClientRects().length),first=focusable[0],last=focusable.at(-1);
  if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}return;
 }
 if(e.target.closest('select,input,textarea,summary')||e.ctrlKey||e.metaKey||e.altKey)return;
 if([' ','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();if(e.repeat)return;if(e.key===' ')showcaseToggle();else showcaseStep(SHOW.index+(e.key==='ArrowRight'?1:-1));}
});
const showcaseFromURL=()=>{if(location.hash==='#showcase'||new URLSearchParams(location.search).get('showcase')==='1')openShowcase();};
window.addEventListener('hashchange',showcaseFromURL);showcaseFromURL();
setInterval(()=>{$('#clock').textContent=new Date().toLocaleTimeString([],{hour12:false});},1000);
setInterval(tickReplay,200);setInterval(poll,2000);poll();
</script></body></html>
