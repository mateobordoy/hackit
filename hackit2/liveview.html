:root{--bg:#10151f;--panel:#18202e;--panel2:#202a3a;--line:#354157;--text:#f1f5fc;--muted:#adbad0}

.map-scroll{overflow-x:auto;margin:0 -10px}.system-map{width:100%;min-width:1000px;height:auto;display:block}.buyer-boundary{fill:#172437;stroke:#49658c;stroke-width:1.4;stroke-dasharray:7 5}
svg .group-title{fill:#b4d3ff;font-size:14px;font-weight:750;letter-spacing:1.3px}svg .group-note{fill:#a1b6d1;font-size:11px}svg .outside-title,svg .lane-title{fill:#99abc5;font-size:10px;letter-spacing:1px;font-weight:600}

.edge.flow{opacity:1;stroke:var(--code)}.flow-inspector{border-top:1px solid var(--line);margin:0 -20px;padding:20px 24px;background:#141d2b;min-height:100px}
.flow-empty{display:flex;gap:16px;align-items:center}.inspect-icon{font-size:28px;color:var(--code);border:1px solid var(--line);border-radius:12px;padding:4px 15px}.flow-empty p{margin:5px 0 0;color:var(--muted);font-size:12px}
.inspector-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.inspector-head h3{font-size:17px;margin:5px 0}.flow-meta{display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12px;margin:10px 0}
.flow-scope{font-size:11.5px;color:var(--muted);margin:8px 0 15px}.payload-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.payload{min-width:0;background:#1b2637;border:1px solid var(--line);border-radius:10px;overflow:hidden}

.recent-transfers,.connection-list{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}.recent-transfers .btn{font-size:11px}.chat{max-height:720px}.msg{padding:15px;line-height:1.6}.msg pre{font-size:13px;line-height:1.7}.find{padding:15px}.find li{margin:7px 0}.kv{gap:6px 12px}th,td{padding:10px 12px}th{background:#202c3e}

<header><div class="dot"></div><h1>Hollerau <span class="brand-sub">/ Negotiation control room</span></h1><button class="btn" id="scoresBtn" onclick="showScores()">Scores</button><button class="btn" id="historyBtn" onclick="showHistory()">Run history</button><div class="stat" id="gstats"></div><div style="flex:1"></div><div class="stat" id="clock"></div></header>
<div class="layout"><aside id="cases"></aside><main id="main"><div class="muted">Waiting for a case… start a run (sandbox or practice) and it appears here.</div></main></div>
<script>
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=(v,d=2)=>v==null||isNaN(v)?'–':Number(v).toFixed(d), tm=t=>t?new Date(t*1000).toLocaleTimeString([], {hour12:false}):'';
const TELEMETRY=new Set(['case_start','trace','model_call','model_done','model_outcome','model_skipped','prep_stage','prep_report','prep_strategy','prep_brief','message_in','message_out','thread_state','delivery_failed']);
const NODES={
 data:{x:115,y:170,w:210,h:104,label:'Data',sub:'documents · news · records',cls:'data',desc:'Local arena data package. Supplier IDs and fixed queries retrieve company records, notes, news, contracts and cost evidence.'},
 arena:{x:115,y:455,w:210,h:116,label:'Seller',sub:'supplier bots via Arena API',cls:'ext',desc:'External suppliers. Only messages, quoted term sheets and permitted API responses cross the buyer boundary.'},
 session:{x:440,y:455,label:'Session manager',sub:'session.py · clocks & delivery',desc:'Runs the case, schedules supplier turns, sends messages, handles deadlines and resumes sessions.'},
 'prep.briefing':{x:440,y:170,label:'Research team',sub:'prep.briefing · four analysts',desc:'Code gathers the data; LLM analysts and the lead prepare findings, possible trades and writer context before negotiation.'},
 lessons:{x:735,y:170,label:'Memory',sub:'lessons.py · earlier outcomes',desc:'Retrieves similar earlier negotiations for preparation. Learning stays disabled in the final.'},
 evidence:{x:1030,y:170,label:'Evidence',sub:'evidence.py · citable facts',desc:'Builds numerical arguments and source references from recorded data.'},
 model:{x:1320,y:170,w:232,h:106,label:'Language model',sub:'Claude · interpretation & writing',cls:'llm',desc:'Analysts, reply reader and email writer use bounded model calls. Code retains numerical decisions.'},
 'negotiation.engine':{x:735,y:455,label:'Negotiator',sub:'negotiation.engine · next move',desc:'Coordinates each supplier thread: the current plan, arguments, alternatives and delivery bookkeeping.'},
 reply_reader:{x:1030,y:340,label:'Reply reader',sub:'reply_reader.py · mood & requests',desc:'Interprets the latest email, detects requests and suggests a tactic from a fixed list.'},
 mailer:{x:1030,y:525,label:'Email builder',sub:'mailer.py · words & exact terms',desc:'Combines guarded model prose with code-written facts, binding statements and term sheets.'},
 pricing:{x:1320,y:455,label:'Cost & value',sub:'pricing.py · C & price ceiling',desc:'Calculates buyer total cost, estimated supplier worth, allowed terms and the price ceiling.'},
 'negotiation.packages':{x:1320,y:710,label:'Offer packages',sub:'negotiation.packages · alternatives',desc:'Evaluates complete packages and cost-checked trade-offs, preserving mandatory terms.'},
 'negotiation.concession':{x:735,y:710,label:'Price step',sub:'concession.py · next price',desc:'Computes the next price using the gap, previous concessions and estimated remaining patience.'},
 'negotiation.closing':{x:1030,y:710,label:'Closing desk',sub:'negotiation.closing · accept / walk',desc:'Selects the cheapest acceptable standing deal, echoes supplier packages and protects offers from expiry.'}
};
const EDGES=[['data','prep.briefing'],['data','evidence'],['arena','session'],
 ['session','prep.briefing'],['session','negotiation.engine'],['session','negotiation.closing'],['session','lessons'],
 ['prep.briefing','lessons'],['prep.briefing','model'],['negotiation.engine','reply_reader'],['reply_reader','model'],
 ['negotiation.engine','mailer'],['negotiation.engine','model'],['negotiation.engine','evidence'],
 ['negotiation.engine','negotiation.packages'],['negotiation.engine','negotiation.concession'],
 ['negotiation.engine','pricing'],['negotiation.packages','pricing'],['negotiation.closing','pricing'],
 ['negotiation.engine','negotiation.closing'],['lessons','model']];
const edgeKey=(a,b)=>[a,b].sort().join('|');
let FLOW=null, FLOW_ITEM=null, MAP_NODE=null;
const ROLE_FROM={writer:'negotiation.engine',reply_reader:'reply_reader',debrief:'lessons'};
const nodeOf=label=>{if(!label)return null;let best=null;for(const k of Object.keys(NODES)){if(label===k||label.startsWith(k+'.')){if(!best||k.length>best.length)best=k}}return best};
const roleNode=r=>ROLE_FROM[r]||'prep.briefing';
let SEL=null, ARENA='https://arena.tacto.ai', S=null, CASES=[], replay=null, TAB='calls', openCalls={}, feedFilter='all';
let VIEW='case', SCORES=null, scoresAt=0;  // VIEW 'scores' | 'history': a table instead of one case
// PINNED: the session of a recorded run open in the case view (no live polling); HIST: /api/history
let PINNED=null, PINRUN=null, HIST=null, histAt=0, HF={case:'',set:'',source:''}, booted=false;
function fresh(){return {events:[],next:0,runStart:null,head:{},session:{},end:null,suppliers:[],msgs:[],states:{},calls:{},callOrder:[],prep:{stages:{},reports:{},strategy:{},brief:{}},
 feed:[],stack:{},open:{},active:{},flows:{},links:{},decisions:[],notes:[]}}
function touchNode(n,ms=1400){if(n)S.active[n]=performance.now()+ms}
function touchFlow(a,b,cls='',ms=1300){if(a&&b){S.flows[a+'>'+b]={until:performance.now()+ms,cls}}}
function apply(e,animate){
 const k=e.event; S.events.push(e);
 for(const transfer of e.transfers||[]){const key=edgeKey(transfer.from,transfer.to);
  const rows=S.links[key]||(S.links[key]=[]),i=rows.findIndex(r=>r.id===transfer.id);
  if(i>=0)rows.splice(i,1);rows.push(transfer);if(rows.length>16)rows.shift();
  if(animate){touchNode(transfer.from);touchNode(transfer.to);touchFlow(transfer.from,transfer.to)}}
 if(k==='case_start'){S.head=e}
 else if(k==='session'){S.session=e;for(const s of e.suppliers||[])if(!S.suppliers.includes(s))S.suppliers.push(s)}
 else if(k==='end'){S.end=e}
 if(e.supplier&&!S.suppliers.includes(e.supplier))S.suppliers.push(e.supplier);
 if(k==='trace'){const n=nodeOf(e.fn),p=nodeOf(e.parent)||'session';
  if(e.phase==='start'){S.open[e.call]=e;if(animate){touchNode(n);if(p&&p!==n)touchFlow(p,n)}}
  else{delete S.open[e.call];if(animate)touchNode(n,500)}
  if(e.phase!=='start')S.feed.push({t:e.at,cls:'f-trace',kind:'trace',txt:`${e.fn}${e.parent?`  ← ${e.parent}`:''}  ${e.phase==='error'?'ERROR '+e.error:'→ '+JSON.stringify(e.result)} (${e.ms} ms)`})}
 else if(k==='model_call'){S.calls[e.call]={...e,status:'running',start:e.at};S.callOrder.push(e.call);if(animate){touchNode('model');touchFlow(roleNode(e.role),'model','llm')}
  S.feed.push({t:e.at,cls:'f-llm',kind:'model',txt:`LLM ⇢ ${e.role}${e.supplier?' ['+e.supplier+']':''}  prompt ${String(e.user||'').length} chars`})}
 else if(k==='model_done'){const c=S.calls[e.call]||(S.calls[e.call]={call:e.call,role:e.role});c.status=e.status;c.seconds=e.seconds;c.answer=e.answer;c.error=e.error;
  if(animate){touchNode('model',600);touchFlow('model',roleNode(c.role),'llm')}
  S.feed.push({t:e.at,cls:'f-llm',kind:'model',txt:`LLM ⇠ ${c.role} ${e.status} in ${e.seconds}s`})}

  body+=`<h3 style="margin:14px 0 8px">${esc(sid)}</h3><div class="findings">`+Object.entries(reps).map(([name,r])=>`<div class="find"><h3>${esc(name)} analyst ${r&&r.leverage?`<span class="badge">leverage: ${esc(r.leverage)}</span>`:''}</h3>${r?`<ul>${(r.findings||[]).map(f=>`<li>${esc(f)}</li>`).join('')||'<li class="muted">no findings</li>'}</ul>`:'<span class="muted">no answer in time</span>'}</div>`).join('')+`</div>`;
  const b=brief||{};if(strat||brief){body+=`<div class="findings" style="margin-top:10px"><div class="find"><h3>lead researcher · strategy</h3><div class="kv"><span>tone</span><span>${esc(b.tone||(strat||{}).tone||'–')}</span>
   <span>argument order</span><span>${esc((b.argument_order||(strat||{}).argument_order||[]).join(' → '))}</span>
   <span>trades</span><span>${(b.trades||[]).map(t=>`<div><span class="chipc">${esc(t.field)}=${esc(typeof t.value==='object'?JSON.stringify(t.value):t.value)}</span> <span class="muted">${esc(t.why)}</span></div>`).join('')||'none'}</span>
   <span>notes</span><span>${esc(b.writer_notes||(strat||{}).notes||'')}</span><span>why</span><span class="muted">${esc(b.rationale||(strat||{}).reason||'')}</span></div></div>`;
   const pb=b.playbook||{};const args=pb.arguments||(spar||{}).arguments||[];
   body+=`<div class="find"><h3>sparring round · playbook</h3>${args.map((a,i)=>`<div style="margin-bottom:6px"><b style="color:var(--them)">them:</b> ${esc(a)}${pb.answers&&pb.answers[i]?`<div><b style="color:var(--us)">us:</b> ${esc(pb.answers[i])}</div>`:''}</div>`).join('')||'<span class="muted">–</span>'}
   ${(pb.raise||[]).length?`<div><b>raise:</b> ${esc(pb.raise.join(' · '))}</div>`:''}${(pb.wants||(spar||{}).wants||[]).length?`<div class="muted">wants: ${esc((pb.wants||spar.wants).join(', '))}</div>`:''}
   ${(spar||{}).weak_spots&&spar.weak_spots.length?`<div class="muted">weak spots: ${esc(spar.weak_spots.join(' · '))}</div>`:''}</div></div>`}}
 if(S.prep.lessons&&S.prep.lessons.length)body+=`<div class="find" style="margin-top:10px"><h3>memory · similar earlier cases</h3><ul>${S.prep.lessons.map(l=>`<li>${esc(l)}</li>`).join('')}</ul></div>`;
 return `<div class="stages">${stg}</div>${body||'<div class="muted">no preparation data (plain engine, or not started yet)</div>'}`}
let expanded=new Set();
function callsHTML(){const rows=S.callOrder.slice().reverse().map(id=>{const c=S.calls[id];const col=c.status==='running'?'var(--warn)':c.status==='ok'?(c.outcome&&c.outcome!=='used'?'var(--bad)':'var(--ok)'):'var(--bad)';
  const open=expanded.has(id);return `<tr class="click" onclick="toggleCall(${id})"><td>${tm(c.start)}</td><td><span class="chipm">${esc(c.role)}</span></td><td>${esc(c.supplier||'')}</td>
   <td style="color:${col}">${esc(c.status)}${c.outcome?' · '+esc(c.outcome):''}</td><td>${c.seconds!=null?c.seconds+'s':'…'}</td><td class="muted">${esc(String(c.answer||c.error||'').slice(0,110))}</td></tr>
   ${open?`<tr><td colspan="6" class="detail"><b>system prompt</b><pre>${esc(c.system)}</pre><b>user prompt (what Python sends)</b><pre>${esc(c.user)}</pre><b>answer (what the model returns)</b><pre>${esc(c.answer||c.error||'…')}</pre></td></tr>`:''}`}).join('');
 return `<table><thead><tr><th>time</th><th>role</th><th>supplier</th><th>status</th><th>latency</th><th>answer (click a row for prompt + answer)</th></tr></thead><tbody>${rows||'<tr><td colspan=6 class=muted>no model calls yet</td></tr>'}</tbody></table>`}
function toggleCall(id){expanded.has(id)?expanded.delete(id):expanded.add(id);render(true)}
function feedHTML(){const f=S.feed.filter(x=>feedFilter==='all'||x.kind===feedFilter).slice(-500).reverse();
 return f.map(x=>`<div class="${x.cls}"><span class="t">${tm(x.t)}</span> ${esc(x.txt)}</div>`).join('')||'<div class="muted">empty</div>'}
function setTab(t){TAB=t;render(true)} function setFeed(f){feedFilter=f;render(true)}
function startReplay(speed){if(!S.events.length)return;const all=S.events.slice();const t0=all[0].at;S=fresh();S.next=all.length;S.runStart=all[0].at;
 replay={all,i:0,t0,speed,wall:performance.now()};render()}
function replayTick(){if(!replay)return;const el=(performance.now()-replay.wall)/1000*replay.speed;
 while(replay.i<replay.all.length&&replay.all[replay.i].at-replay.t0<=el){apply(replay.all[replay.i],true);replay.i++}
 if(replay.i>=replay.all.length){replay=null}}
let lastHTML={};
function setHTML(id,html){if(lastHTML[id]!==html){const el=document.getElementById(id);if(el){const sc=el.scrollTop,focused=el.contains(document.activeElement)?document.activeElement.getAttribute('aria-label'):null;el.innerHTML=html;el.scrollTop=sc;if(focused){const next=[...el.querySelectorAll('[aria-label]')].find(n=>n.getAttribute('aria-label')===focused);next?.focus({preventScroll:true})}}lastHTML[id]=html}}
// --- Scores view: the latest run of each case against earlier runs, the team's best and the reference
function showScores(){VIEW='scores';PINNED=null;replay=null;navOn('scoresBtn');$('#main').dataset.case='';
 document.querySelectorAll('.case').forEach(x=>x.classList.remove('sel'));
 if(SCORES)renderScores();else $('#main').innerHTML='<div class="muted">reading the runs…</div>';loadScores()}
async function loadScores(){scoresAt=Date.now();try{SCORES=await (await fetch('/api/scores')).json();if(VIEW==='scores')renderScores()}catch(err){console.error(err)}}
const sc3=v=>v==null?'–':Number(v).toFixed(3);
const hm=t=>{if(!t)return'';const d=new Date(t*1000),today=new Date().toDateString()===d.toDateString();
 return (today?'':d.toLocaleDateString([], {weekday:'short'})+' ')+d.toLocaleTimeString([], {hour12:false,hour:'2-digit',minute:'2-digit'})};
function delta(v){if(v==null)return '<span class="muted">–</span>';const col=v>0.0005?'var(--ok)':v<-0.0005?'var(--bad)':'var(--muted)';
 return `<span style="color:${col}">${v>0.0005?'+':''}${v.toFixed(3)}</span>`}
function runCell(r){return r?`<div class="runlink" title="open this run" onclick="event.stopPropagation();openRun('${esc(r.session)}')"><b>${sc3(r.score)}</b><div class="sub">${esc(hm(r.at))} · ${esc(r.source)}${r.deal===false?' · no deal':''}</div></div>`:'<span class="muted">not run</span>'}
// --- History view: every recorded run of every worktree; a click opens it in the case view
function showHistory(){VIEW='history';PINNED=null;replay=null;navOn('historyBtn');$('#main').dataset.case='';
 document.querySelectorAll('.case').forEach(x=>x.classList.remove('sel'));
 if(HIST)renderHistory();else $('#main').innerHTML='<div class="muted">reading the recorded runs…</div>';loadHistory()}
async function loadHistory(){histAt=Date.now();try{HIST=await (await fetch('/api/history')).json();if(VIEW==='history')renderHistory()}catch(err){console.error(err)}}
function setHF(k,v){HF[k]=v;renderHistory()}
const when=t=>t?new Date(t*1000).toLocaleString([], {weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false}):'';
function renderHistory(){const runs=(HIST&&HIST.runs)||[];
 const values=k=>[...new Set(runs.map(r=>r[k]).filter(Boolean))].sort((a,b)=>k==='case'?case_cmp(a,b):a.localeCompare(b));
 const pick=(k,label)=>`<label class="muted" style="font-size:12px">${label} <select onchange="setHF('${k}',this.value)">${['',...values(k)].map(v=>`<option value="${esc(v)}" ${HF[k]===v?'selected':''}>${v?esc(v):'all'}</option>`).join('')}</select></label>`;
 const shown=runs.filter(r=>(!HF.case||r.case===HF.case)&&(!HF.set||r.set===HF.set)&&(!HF.source||r.source===HF.source));
 const badge=(on,label,tip)=>on?`<span class="badge" title="${tip}">${label}</span>`:'';
 const untimed=runs.filter(r=>!r.at).length;
 const rows=shown.map(r=>`<tr class="click" onclick="openRun('${esc(r.session)}')"><td>${r.at?esc(when(r.at)):'<span class="muted">–</span>'}</td><td><b>${esc(r.case)}</b></td>
  <td class="muted">${esc(r.title||'')}</td><td>${esc(r.set||'')}</td><td>${esc(r.source||'')}</td><td class="num">${r.running?'<span class="pill live">running</span>':r.score==null?'–':sc3(r.score)}</td>
  <td>${r.deal===false?'<span class="bad">no deal</span>':r.deal?'deal':'<span class="muted">–</span>'}</td>
  <td>${badge(r.has_live,'live','full telemetry: module map, LLM calls, preparation')}${badge(r.has_journal,'journal','our decisions with their times')}${badge(r.has_arena,'arena','both sides\' e-mails, claim checks, the supplier\'s back office, the result')}</td>
  <td class="muted" style="font:11px ui-monospace,monospace">${esc(r.session)}</td></tr>`).join('');
 $('#main').innerHTML=`<div class="casehead"><h1>History · every recorded run</h1><span class="muted">${shown.length} of ${runs.length} runs</span></div>
  <div class="card"><div class="flex" style="margin-bottom:10px">${pick('case','case')}${pick('set','set')}${pick('source','played in')}</div>
  <div class="muted" style="font-size:11.5px;margin-bottom:8px">From every worktree's live files and run journals, and the arena sessions pulled with <span class="chipc">uv run hackit2 pull --set practice</span> (and <span class="chipc">--set sandbox</span>): those are all of the team's sessions ('team': played by anyone). Click a run to open it.${untimed?` ${untimed} pulled session(s) have no known start time${HIST&&HIST.offline?' (offline: the arena is not asked)':''}; they are listed last.`:''}</div>
  <div class="tablewrap"><table><thead><tr><th>Started</th><th>Case</th><th>Title</th><th>Set</th><th>Played in</th><th class="num">Score</th><th>Deal</th><th>Recorded</th><th>Session</th></tr></thead>
  <tbody>${rows||'<tr><td colspan="9" class="muted">no recorded runs</td></tr>'}</tbody></table></div></div>`}
function case_cmp(a,b){const k=c=>[c[0]==='P'?0:c[0]==='D'?1:2,parseInt(c.replace(/\D/g,''))||0];const x=k(a),y=k(b);return x[0]-y[0]||x[1]-y[1]}
async function openRun(session){FLOW=null;FLOW_ITEM=null;MAP_NODE=null;replay=null;
 let r;try{r=await (await fetch('/api/run?session='+encodeURIComponent(session))).json()}catch(err){console.error(err);return}
 if(!r.found){alert('No local record of this run yet: it is running on the arena in a harness that writes no live files. It appears here once its live file exists or after hackit2 pull.');return}
 VIEW='case';PINNED=session;PINRUN=r.run;navOn(null);SEL=r.run.case;S=fresh();
 for(const e of r.events)apply(e,false);S.next=r.events.length;S.runStart=r.events.length?r.events[0].at:null;
 document.querySelectorAll('.case').forEach(x=>x.classList.remove('sel'));$('#main').dataset.case='';render(true)}
function notesHTML(){if(!S.notes.length)return '<div class="muted">nothing recorded: the back office and the bot\'s reasons come with the arena sessions pulled by <span class="chipc">hackit2 pull</span></div>';
 return `<table><thead><tr><th>time</th><th>round</th><th>supplier</th><th>from → to</th><th>what it wrote</th></tr></thead><tbody>${S.notes.map(n=>`<tr><td>${tm(n.at)}</td><td>${esc(n.round??'')}</td><td>${esc(n.supplier||'')}</td>
  <td>${n.sender==='bot reasoning'?'<span class="chipm">bot reasoning</span>':esc(n.sender||'')+(n.recipient?' → '+esc(n.recipient):'')}</td><td>${esc(n.text||'')}</td></tr>`).join('')}</tbody></table>`}
function historySVG(row){const h=row.history||[];if(!h.length)return '';const vals=[...h.map(r=>r.score),row.team].filter(v=>v!=null);
 let lo=Math.min(...vals),hi=Math.max(...vals);if(hi-lo<0.02){lo-=0.01;hi+=0.01}
 const W=150,H=30,P=4,x=i=>h.length<2?W/2:P+i*(W-2*P)/(h.length-1),y=v=>H-P-(v-lo)/(hi-lo)*(H-2*P);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
 if(row.team!=null)s+=`<line x1="0" x2="${W}" y1="${y(row.team)}" y2="${y(row.team)}" stroke="var(--ok)" stroke-dasharray="3 3" opacity=".75"><title>team best ${sc3(row.team)}</title></line>`;
 if(h.length>1)s+=`<polyline fill="none" stroke="var(--us)" stroke-width="1.5" points="${h.map((r,i)=>x(i)+','+y(r.score)).join(' ')}"/>`;
 s+=h.map((r,i)=>{const last=i===h.length-1;return `<circle cx="${x(i)}" cy="${y(r.score)}" r="${last?3.6:2.6}" fill="${last?'var(--us)':'#6b7488'}"><title>${sc3(r.score)} · ${esc(hm(r.at))} · ${esc(r.source)}</title></circle>`}).join('');
 return s+'</svg>'}
function teamCell(row){if(row.team==null)return '<span class="muted">–</span>';
 const parts=[row.team_live!=null?`live ${sc3(row.team_live)}`:null,row.team_pulled!=null?`pulled ${sc3(row.team_pulled)}`:null].filter(Boolean).join(' · ');
 return `<b>${sc3(row.team)}</b><div class="sub">${esc(parts)}</div>`}
function tile(label,value,note){return `<div class="tile"><div class="l">${label}</div><div class="n">${value==null?'–':value.toFixed(1)}</div><div class="sub">${note||''}</div></div>`}
function renderScores(){const d=SCORES;if(!d)return;const t=d.totals||{},team=d.team||{},p=team.practice||{};
 const vsTeam=(a)=>a!=null&&t.team!=null?`${a-t.team>=0?'+':''}${(a-t.team).toFixed(1)} vs team best`:'';
 const teamLine=team.offline?`offline: the team's best comes from the pulled sessions only (${team.pulled_cases} cases). Refresh them with <span class="chipc">uv run hackit2 pull --set practice</span>.`
  :team.at?`team best read live from the arena at ${esc(new Date(team.at*1000).toLocaleTimeString([], {hour12:false}))}${p.left!=null?` · practice quota: ${p.used} used, ${p.left} left`:''}, merged with the pulled sessions (${team.pulled_cases} cases)`
  :`reading the team's best from the arena…`;
 const rows=(d.rows||[]).map(r=>{const atBest=r.gap!=null&&r.gap>-0.0005;const has=CASES.some(c=>c.case===r.case);
  return `<tr class="${has?'click':''}" ${has?`onclick="select('${esc(r.case)}')"`:''}><td><b>${esc(r.case)}</b>${atBest?' <span title="the latest run equals the team best" style="color:var(--ok)">★</span>':''}</td>
   <td>${runCell(r.latest)}</td><td>${runCell(r.previous)}</td><td class="num">${delta(r.change)}</td>
   <td class="num">${sc3(r.best)}</td><td>${teamCell(r)}</td><td class="num">${delta(r.gap)}</td><td class="num">${sc3(r.reference)}</td><td>${historySVG(r)}</td></tr>`}).join('');
 $('#main').innerHTML=`<div class="casehead"><h1>Scores · latest runs against earlier runs and the team's best</h1></div>
  <div class="tiles">${tile('Latest runs',t.latest_score,vsTeam(t.latest_score))}${tile('Our best run',t.best,vsTeam(t.best))}${tile('Team best',t.team,'what the practice board counts')}${tile('Reference run',t.reference,vsTeam(t.reference))}</div>
  <div class="card"><h2>Per case</h2><div class="muted" style="font-size:12px;margin-bottom:8px">${teamLine}${team.error&&!team.offline?` · <span class="bad">arena not reachable: ${esc(team.error)}</span>`:''}</div>
  <div class="tablewrap"><table><thead><tr><th>Case</th><th>Latest run</th><th>Previous run</th><th class="num">Change</th><th class="num">Our best</th><th>Team best</th><th class="num">Latest vs team</th><th class="num">Reference</th><th>Runs (oldest → latest, dashed: team best)</th></tr></thead>
  <tbody>${rows||'<tr><td colspan="9" class="muted">no finished runs yet</td></tr>'}</tbody></table></div>
  <div class="muted" style="font-size:11.5px;margin-top:8px">Runs from the logs/runs folders of: ${esc((d.sources||[]).join(', ')||'–')}. Totals are board-style: the mean over the practice cases × 100, a case without a score counting 0. Click a case with a live file to open it.</div></div>`}
function render(force){if(VIEW!=='case'||!SEL||!S)return;const c=CASES.find(x=>x.case===SEL)||{};
 if(!document.getElementById('mapbox')||$('#main').dataset.case!==SEL){
  $('#main').dataset.case=SEL;lastHTML={};
  $('#main').innerHTML=`<div class="casehead"><h1 id="ctitle"></h1><span id="cmeta" class="muted"></span><span style="flex:1"></span>
   <span class="flex">${PINNED?`<button class="btn" onclick="showHistory()">← History</button>`:''}<button class="btn" onclick="startReplay(4)">▶ replay ×4</button><button class="btn" onclick="startReplay(12)">▶ ×12</button><button class="btn" onclick="replay=null;select(SEL)">⟳ live</button></span></div>
   <div class="now" id="now"></div><div id="caseoverview" class="case-overview"></div>
   <div class="card architecture-card"><div class="section-heading"><div><span class="eyebrow">SYSTEM EXPLORER</span><h2>One buyer. A connected negotiation system.</h2><p class="muted">See how supplier messages and our data become a checked offer. Every connection is inspectable.</p></div><span class="pill done">read-only view</span></div>
   <div class="map-legend"><span><i class="legend-dot buyer"></i>Buyer code</span><span><i class="legend-dot seller"></i>Seller / Arena</span><span><i class="legend-dot data"></i>Data</span><span><i class="legend-dot llm"></i>Language model</span><span class="muted">Moving = recent activity · dotted = not captured · click for details</span></div>
   <div class="map-scroll"><div id="mapbox"></div></div><div id="flowdetail" class="flow-inspector" aria-live="polite"></div></div>
   <div class="grid2"><div class="card"><h2>Conversation · Buyer ↔ Seller</h2><div class="chat" id="chat"></div></div><div class="card"><h2>Offer comparison · Total cost (C) &amp; unit prices</h2><div id="states"></div></div></div>
   <div class="card"><div class="tabs" id="tabs"></div><div id="tabbody"></div></div>`}
 const title=S.head.title||S.session.title||c.title||'';$('#ctitle').textContent=`${SEL} · ${title}`;
 const sid=S.session.session_id||c.session_id;
 $('#cmeta').innerHTML=`${esc(S.head.type||c.type||'')} · goal ${esc(S.head.goal||c.goal||'')} · ${S.suppliers.length} supplier(s)${S.end?` · <b style="color:var(--ok)">score ${fmt(S.end.score,3)}</b>`:''}${sid?` · <a href="${esc(ARENA)}/replay/${esc(sid)}" target="_blank">arena replay</a>`:''}${replay?' · <span class="live">replaying</span>':''}${PINNED&&PINRUN?` · <span class="done">recorded run</span> ${esc(PINRUN.at?when(PINRUN.at):'')} · played in ${esc(PINRUN.source||'')}`:''}`;
 setHTML('now',nowBanner());setHTML('mapbox',mapSVG());setHTML('flowdetail',flowHTML());
 const chatEl=document.getElementById('chat');const atBottom=chatEl&&chatEl.scrollHeight-chatEl.scrollTop-chatEl.clientHeight<60;
 setHTML('chat',chatHTML());if(chatEl&&atBottom)chatEl.scrollTop=chatEl.scrollHeight;
 setHTML('states',statesHTML());
 const lastIn=[...S.msgs].reverse().find(m=>m.event==='message_in'),lastOut=[...S.msgs].reverse().find(m=>m.event==='message_out');
 setHTML('caseoverview',`<div><span>Run</span><b>${S.end?(S.end.deal?'Deal reached':'Closed'):PINNED?'Recorded':'In progress'}</b></div><div><span>Suppliers</span><b>${S.suppliers.length}</b></div><div><span>Last seller message</span><b>${lastIn?tm(lastIn.at):'Not recorded'}</b></div><div><span>Last buyer message</span><b>${lastOut?tm(lastOut.at):'Not recorded'}</b></div><div><span>Model activity</span><b>${S.head.observer?'Not observed':S.callOrder.length+' calls'}</b></div>`);
 const tabs=[['calls',S.head.observer?'LLM calls (not observed)':`LLM calls (${S.callOrder.length})`],['prep','Research & preparation'],['notes',`Supplier back office (${S.notes.length})`],['feed','Activity & function trace']];
 setHTML('tabs',tabs.map(([k,l])=>`<div class="tab ${TAB===k?'on':''}" onclick="setTab('${k}')">${l}</div>`).join('')+(TAB==='feed'?`<span style="flex:1"></span>`+['all','trace','model','msg','dec'].map(f=>`<div class="tab ${feedFilter===f?'on':''}" onclick="setFeed('${f}')">${f}</div>`).join(''):''));
 setHTML('tabbody',TAB==='calls'?callsHTML():TAB==='prep'?prepHTML():TAB==='notes'?notesHTML():`<div class="feed">${feedHTML()}</div>`)}
function frame(){replayTick();if(S&&SEL&&VIEW==='case'){setHTML('mapbox',mapSVG());setHTML('now',nowBanner());if(replay)render(true)}requestAnimationFrame(frame)}
if(typeof document!=='undefined'){poll();requestAnimationFrame(frame);setInterval(()=>{if(S&&SEL&&!replay)render(true)},1500)}
</script></body></html>
